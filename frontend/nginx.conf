server {
    listen 80;
    server_name localhost;

    # 1. React 정적 파일 서빙 (SPA 라우팅 지원)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. FastAPI (ML 예측 서버) 리버스 프록시
    location /api/predict/ {
        proxy_pass http://ml-server:8000/api/predict/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. Node.js 백엔드 API 프록시 (센서 등)
    location /api/ {
        proxy_pass http://backend-server:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. Socket.io (WebSocket) 리버스 프록시
    location /socket.io/ {
        proxy_pass http://backend-server:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
